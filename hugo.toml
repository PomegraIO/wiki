# ── Pomegra Wiki — Hugo configuration ───────────────────────────────────
# The wiki is mounted under /wiki/ inside the main pomegra.io site (sibling
# of /learn/). All `RelPermalink` / `absURL` / `relURL` calls already produce
# the correct path because of `baseURL`. Hardcoded absolute paths inside
# markdown bodies (e.g. `[Stock](/stock/)`) are rewritten to include the
# /wiki/ prefix at build time by `canonifyURLs = true`.
#
# Local development:
#   hugo server --port 1314 --bind 127.0.0.1 \
#               --baseURL "http://localhost:1314/wiki/" \
#               --appendPort=false --disableFastRender
# Then browse http://localhost:1314/wiki/

baseURL = 'https://pomegra.io/wiki/'
defaultContentLanguage = 'en'
languageCode = 'en-us'
title = 'Pomegra Wiki'
enableRobotsTXT = true
# enableGitInfo surfaces .GitInfo so .Lastmod resolves to each file's last
# commit date (it's first in Hugo's default lastmod chain: [':git', 'lastmod',
# 'date', 'publishDate']). Without it — and with no date/lastmod in front
# matter — .Lastmod is zero, so layouts/sitemap.xml emits no <lastmod> at all,
# which starves Google's re-crawl signal and leaves the sitemap stale in Search
# Console. Tradeoff: it adds build cost at scale (a full --gc --minify of ~14k
# pages runs ~8.5 min with this on). Requires the build tree to be a git repo
# with content history.
enableGitInfo = true

# canonifyURLs=true rewrites absolute paths inside content (e.g. `/stock/`)
# to include the baseURL prefix. This is what makes 10k+ cross-links keep
# working when the wiki is mounted under /wiki/ instead of at the root.
canonifyURLs = true

buildDrafts = false
buildFuture  = false

# Category (section) pages paginate at 60 entries/page — enough to scan in one
# screen-scroll, few enough that the page stays light. /equity/ → /equity/page/2/.
[pagination]
  pagerSize = 60
  path = 'page'

# Pretty URLs: /stock/ instead of /stock.html
uglyURLs = false

# We render raw HTML inside markdown (infobox <aside>, hatnote <div>, etc.)
# so the goldmark parser must permit it.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

# Subdirectories under content/ are organisational only — the URL of an entry
# is always /:contentbasename/ (filename without extension), regardless of
# which subdirectory it lives in. This is what keeps the cross-link allowlist
# (/stock/, /bond/, …) trustworthy.
[permalinks.page]
  '/**' = '/:contentbasename/'

[params]
  description = 'A reader-friendly encyclopedia of the financial world. Plain-language entries on markets, instruments, institutions, and ideas, densely cross-linked.'
  tagline = 'The reader-friendly encyclopedia of the financial world'
  author = 'Pomegra'
  homeURL = 'https://pomegra.io'
  learnURL = 'https://pomegra.io/learn'
  wikiURL = 'https://pomegra.io/wiki/'
  contactURL = 'https://pomegra.io/contact'
  githubURL = 'https://github.com/PomegraIO'
  twitterURL = 'https://twitter.com/pomegra_io'
  twitterHandle = '@pomegra_io'
  linkedinURL = 'https://linkedin.com/company/pomegra'
  logo = 'img/logo.svg'
  # linkCount is the latest total reported by `python scripts/check_links.py`.
  # Surfaced on the home page as one of the four stat tiles.
  linkCount = 10553
  # Default Open-Graph / Twitter card. Path is relative to the wiki root
  # (Hugo prepends the baseURL via the `absolute-url.html` partial).
  ogImage = '/img/og-default.png'
  ogImageWidth = 1200
  ogImageHeight = 630

  # Analytics — shared Umami instance with /learn (analytics.pomegra.io).
  # data-website-id is the *wiki* property; mirrors the pattern Learn uses
  # in books/library/docusaurus.config.ts (different website-id per site).
  umamiSrc = 'https://analytics.pomegra.io/script.js'
  umamiWebsiteId = '3296fbd4-6f4b-41fa-bbed-13193974c9f8'

  # Google Search Console verification token (issued by the wiki property).
  # Same console account as /learn but a different verified property.
  googleSiteVerification = 'GnFvBlrDnjRHUjeRjhQdDeejc3Z5l3g7BPnpNpAJRAQ'

# Disable taxonomy/term pages — we don't want accidental /tags/foo/ archives.
disableKinds = ['taxonomy', 'term']

[outputs]
  # `JSON` on the home produces /index.json — the search index consumed by
  # the navbar's search input. Stays tiny even at 10k entries because we
  # only emit title, description, and URL per page.
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  page = ['HTML']

[taxonomies]
  tag = 'tags'
  topic = 'topics'

# Sitemap defaults; per-page tweaks live in front matter.
[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

[minify]
  disableHTML = false
  disableCSS  = false
  disableJS   = false
  minifyOutput = true

# ── Author + Organization (referenced by JSON-LD in baseof.html) ────────
[params.org]
  name = 'Pomegra'
  url = 'https://pomegra.io'
  logo = 'https://pomegra.io/img/logo.png'
  sameAs = ['https://twitter.com/pomegra_io', 'https://github.com/PomegraIO', 'https://linkedin.com/company/pomegra']
