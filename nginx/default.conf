server {
    listen 8888;
    server_name _;

    # Environment-specific overrides (dev disables caching, prod is empty).
    # The Dockerfile symlinks env.conf → either production.conf or development.conf.
    include /etc/nginx/conf.d/env.conf;

    root /usr/share/nginx/html;
    index index.html;

    # `absolute_redirect off` keeps Location headers relative so the
    # reverse proxy (APISIX) propagates its own host/port instead of
    # this container's :8888.
    absolute_redirect off;

    # Custom 404: Hugo builds 404.html at the site root, which the Dockerfile
    # copies to /usr/share/nginx/html/wiki/404.html — so relative to this
    # server's root the page is /wiki/404.html (NOT /404.html, which would
    # itself 404 and fall back to nginx's bare default page). error_page is
    # inherited by every location block below, so the styled page also covers
    # missing assets matched by the regex locations.
    error_page 404 /wiki/404.html;

    # Trailing-slash convention: every wiki entry lives at /wiki/<slug>/.
    # If a request lands without the slash, internally rewrite (no 301).
    location / {
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ $1/ break;
        }
        try_files $uri $uri/ =404;
    }

    # Never let the browser cache index.html — content updates ride on
    # hash-fingerprinted CSS/JS, but the entry document itself must be
    # re-validated on every visit.
    location ~ /index\.html$ {
        add_header 'Cache-Control' 'no-cache';
    }

    # Hugo Pipes-fingerprinted assets (CSS/JS with sha256 in the filename)
    # can be cached forever — the URL changes whenever the content does.
    # Quoted so nginx doesn't misparse the {40,} quantifier as a config block.
    location ~* "\.(?:css|js)\.[a-f0-9]{40,}\." {
        add_header 'Cache-Control' 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }

    # SVG/PNG/ICO/woff2 etc — cache for a day, immutable not safe (filenames
    # are stable).
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff2|woff)$ {
        add_header 'Cache-Control' 'public, max-age=86400';
        try_files $uri =404;
    }

    # robots.txt / sitemap.xml: short cache so search engines can pick up
    # changes within a build cycle.
    location = /wiki/robots.txt {
        add_header 'Cache-Control' 'public, max-age=300';
    }
    location = /wiki/sitemap.xml {
        add_header 'Cache-Control' 'public, max-age=300';
    }
}
