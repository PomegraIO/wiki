{{ define "main" }}
<article class="wiki-article">
  <div class="wiki-article-layout">
    <div class="wiki-article-body wiki-list-body">
      <h1 class="wiki-title">{{ .Title }}</h1>
      {{ with .Params.lede }}
        <p class="wiki-lede">{{ . | markdownify }}</p>
      {{ end }}
      <div class="wiki-prose">
        {{ .Content }}
      </div>
    </div>
  </div>
</article>
{{ end }}
