<header class="wiki-navbar">
  <div class="wiki-navbar-inner">
    <a class="wiki-brand" href="{{ "/" | relURL }}">
      <img src="{{ "/img/logo.svg" | relURL }}" alt="" class="wiki-brand-logo" />
      <span class="wiki-brand-title">Pomegra Wiki</span>
    </a>

    <nav class="wiki-nav" aria-label="Primary">
      <a href="{{ "/" | relURL }}" class="wiki-nav-link{{ if .IsHome }} is-active{{ end }}">Main page</a>
      <a href="{{ "/atlas/" | relURL }}" class="wiki-nav-link{{ if or (eq .RelPermalink "/atlas/") (and (not .IsHome) (ne .Section "") (ne .Section "companies")) }} is-active{{ end }}" title="Browse the wiki by topic">Browse</a>
      <a href="{{ "/companies/" | relURL }}" class="wiki-nav-link{{ if eq .Section "companies" }} is-active{{ end }}" title="The Exchange — every company profiled, by ticker">Companies</a>
      <a id="pom-random" href="#" class="wiki-nav-link" title="Open a random entry">Random</a>
      <a href="{{ "/about/" | relURL }}" class="wiki-nav-link{{ if eq .RelPermalink "/about/" }} is-active{{ end }}">About</a>

      <span class="wiki-nav-divider" aria-hidden="true"></span>

      <a href="{{ .Site.Params.learnURL }}"
         class="wiki-nav-link is-external"
         data-umami-event="cross-property-click"
         data-umami-event-to="learn"
         title="Pomegra Learn — 30-book financial education curriculum">Learn</a>
      <a href="{{ .Site.Params.homeURL }}"
         class="wiki-nav-link is-external"
         data-umami-event="cross-property-click"
         data-umami-event-to="home"
         title="Pomegra — the home page">Pomegra.io</a>
    </nav>

    <div class="wiki-nav-tools">
      <div class="wiki-search" role="search">
        <input id="pom-search-input" type="search" placeholder="Search the wiki…" aria-label="Search the wiki" autocomplete="off" spellcheck="false" />
        <div id="pom-search-results" class="wiki-search-results" hidden></div>
      </div>
      <button id="pom-theme-toggle" type="button" class="wiki-theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
