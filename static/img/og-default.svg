<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Pomegra Wiki — the reader-friendly encyclopedia of the financial world">
  <rect width="1200" height="630" fill="#f4ede2"/>
  <line x1="80" y1="80" x2="80" y2="550" stroke="#d4cdbd" stroke-width="2"/>
  <text x="120" y="180" font-family="'Source Serif 4',Georgia,serif" font-size="84" font-weight="700" fill="#0f0f10">Pomegra Wiki</text>
  <text x="120" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="6" font-weight="700" fill="#c0392b">THE READER-FRIENDLY ENCYCLOPEDIA</text>
  <text x="120" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="6" font-weight="700" fill="#c0392b">OF THE FINANCIAL WORLD</text>
  <text x="120" y="380" font-family="'Source Serif 4',Georgia,serif" font-size="32" fill="#3a3a44" font-weight="400">Plain-language entries on markets, instruments,</text>
  <text x="120" y="424" font-family="'Source Serif 4',Georgia,serif" font-size="32" fill="#3a3a44" font-weight="400">institutions, and the ideas that move them.</text>
