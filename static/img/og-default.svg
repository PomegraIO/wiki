  <text x="1080" y="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="3" fill="#5b5b63" text-anchor="end" font-weight="700" opacity="0.7">POMEGRA.IO/WIKI</text>
