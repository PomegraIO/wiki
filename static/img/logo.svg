<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pomegra Wiki">
  <!-- Pomegra mark: cream paper square with accent-red P, editorial in feel. -->
  <rect width="64" height="64" rx="10" fill="#f4ede2"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="9.5" fill="none" stroke="#d4cdbd" stroke-width="1.5"/>
  <!-- inner hairline rule -->
  <line x1="10" y1="52" x2="54" y2="52" stroke="#d4cdbd" stroke-width="1"/>
  <!-- Wordmark 'P' in Pomegra accent red -->
  <text x="32" y="44"
        text-anchor="middle"
        font-family="'Source Serif 4','Source Serif Pro',Georgia,serif"
        font-size="40"
        font-weight="700"
        fill="#c0392b">P</text>
  <!-- tiny mono kicker beneath -->
  <text x="32" y="60"
        text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="6"
        letter-spacing="1.5"
        font-weight="700"
        fill="#0f0f10">WIKI</text>
</svg>
